<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto | CrossZfit</title>
  <meta name="description" content="Escribinos para coordinar tu clase de prueba o hacer cualquier consulta. Encontranos en Montevideo.">

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="CrossZfit">
  <meta property="og:title" content="Contacto | CrossZfit">
  <meta property="og:description" content="Escribinos para coordinar tu clase de prueba o hacer cualquier consulta. Encontranos en Montevideo.">
  <meta property="og:image"
    content="https://images.unsplash.com/photo-1609265490702-78689c867e36?q=80&w=1200&auto=format&fit=crop">

  <link rel="icon" href="../favicon.ico">
  <script type="module" src="/src/main.js"></script>
</head>

<body>
  <!-- @header -->

  <main id="contenido">
    <section class="about-us">
      <div class="container">
        <div class="row justify-content-center">
          <div class="col-md-8 col-lg-6">
            <h1 class="text-center">Contacto</h1>
            <p class="text-center">Completá el formulario y te respondemos por WhatsApp.</p>

            <form id="form-contacto" novalidate>
              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre</label>
                <input type="text" class="form-control" id="nombre" name="nombre" autocomplete="name"
                  placeholder="Tu nombre" required>
                <div class="invalid-feedback">Contanos cómo te llamás.</div>
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" id="email" name="email" autocomplete="email"
                  placeholder="tu@correo.com" required>
                <div class="invalid-feedback">Ingresá un correo válido.</div>
              </div>
              <div class="mb-3">
                <label for="mensaje" class="form-label">Mensaje</label>
                <textarea class="form-control" id="mensaje" name="mensaje" rows="4" required></textarea>
                <div class="invalid-feedback">Escribí tu consulta.</div>
              </div>
              <button type="submit" class="btn btn-dark w-100">Enviar por WhatsApp</button>
            </form>
          </div>
        </div>

        <div class="row justify-content-center">
          <div class="col-md-10 col-lg-8">
            <div class="mapa">
              <iframe title="Ubicación de CrossZfit en Google Maps"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3274.842513148223!2d-56.199700790977694!3d-34.83505197275903!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95a02bdef6deafb9%3A0xfa469ae9a218538!2sCROSS-Z-FIT!5e0!3m2!1ses-419!2suy!4v1725834481892!5m2!1ses-419!2suy"
                allowfullscreen loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- @footer -->
</body>

</html>
